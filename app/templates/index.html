<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Centrare la tabella nella pagina */
        #witnesses-table {
            margin: 0 auto; /* Centro orizzontalmente */
            text-align: center; /* Centrare il testo all'interno delle celle */
        }
        /* Centrare l'intero contenuto */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
    <title>COLLAZIONATORE</title>
    <script>
        async function fetchWitnesses() {
            const response = await fetch('/get_witnesses/');
            const witnesses = await response.json();
            updateWitnessesList(witnesses);
        };

        function updateWitnessesList(witnesses) {
            const tableBody = document.querySelector('#witnesses-table tbody');
            tableBody.innerHTML = ''; // Pulisci il contenuto della tabella

            witnesses.forEach(witness => {
                const row = document.createElement('tr');

                const idCell = document.createElement('td');
                idCell.textContent = witness.id;
                row.appendChild(idCell);

                const nameCell = document.createElement('td');
                nameCell.textContent = witness.name;
                row.appendChild(nameCell);

                const actionCell = document.createElement('td');
                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Rimuovi';
                deleteButton.onclick = () => deleteWitness(witness.id);
                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                tableBody.appendChild(row);
            });
        };

        async function deleteWitness(id) {
            const witObj = { witness_id: id };
            console.log('witObj', witObj);

            const response = await fetch('/delete_witness/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(witObj)
            });
            if (response.ok) {
                alert('Testimone rimosso con successo!');
                fetchWitnesses();  // Ricarica la lista dei testimoni
            } else {
                alert('Errore nella rimozione del testimone');
            }
        }

        window.onload = fetchWitnesses;
    </script>
</head>
<body>
    <h1 style="text-align: center;">COLLAZIONATORE</h1>
    <p style="text-align: center;">Uno strumento per la collazione dei testimoni.</p>

    <form action="/add_witness/" method="post" style="text-align: center;">
        <label for="name">Nome Testimone:</label><br>
        <input type="text" id="name" name="name"><br><br>
        <label for="text">Testo del Testimone:</label><br>
        <textarea id="text" name="text" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Aggiungi Testimone">
    </form>

    <br>

    <!-- Lista dei testimoni nel database -->
    <h3 style="text-align: center;">Testimoni nel Database:</h3>
    <table id="witnesses-table" border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Azione</th>
            </tr>
        </thead>
        <tbody>
            <!-- Le righe della tabella saranno aggiunte dinamicamente con JavaScript -->
        </tbody>
    </table>

    <br>

    <form action="/collation/" method="get" style="text-align: center;">
        <input type="submit" value="Avvia Collazione">
    </form>

    {% if collation_html %}
    <div style="text-align: center;">
        <h2>Risultato della Collazione</h2>
        <div>{{ collation_html | safe }}</div>
    </div>
    {% endif %}
</body>
</html>
